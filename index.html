<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Hace que la página se adapte bien al celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perro aleatorio</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="tarjeta">
    <h1>🐶 Perro aleatorio</h1>

    <!-- Contenedor de la foto: tiene altura fija para que la tarjeta no "salte" -->
    <div class="marco">
      <img id="foto" alt="Foto de un perro">
    </div>

    <!-- Acá mostramos la raza o los mensajes de estado y error -->
    <p id="estado" class="estado">Cargando…</p>

    <button id="boton">Mostrar otro</button>
  </main>

  <!-- El script va al final para que el HTML ya exista cuando se ejecute -->
  <script src="app.js"></script>
</body>
</html>
